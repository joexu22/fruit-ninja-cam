[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-ninja-cam"
version = "0.1.0"
description = "Webcam Fruit Ninja with MediaPipe index-fingertip blade tracking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joe Xu" }]
dependencies = [
    "mediapipe>=0.10.9",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fruit-ninja-cam = "fruit_ninja_cam.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
