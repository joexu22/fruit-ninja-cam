<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruit Ninja Cam</title>
<meta name="description" content="Webcam Fruit Ninja in the browser. MediaPipe hand tracking turns your index fingertip into the blade. Runs entirely on your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111016;
    --ink: #f2f2f6;
    --muted: #aeaeb8;
    --gold: #fac456;
    --panel: rgba(18, 16, 26, 0.62);
    --border: rgba(96, 84, 90, 0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: Rubik, system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; cursor: crosshair; }
  video { display: none; }
  #controls {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: min(560px, calc(100vw - 32px));
  }
  #controls.hidden { display: none; }
  button {
    font: 700 15px Rubik, system-ui, sans-serif; letter-spacing: .02em; color: var(--ink);
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px 18px; cursor: pointer;
  }
  button.primary { background: var(--gold); color: #1a1408; border-color: transparent; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #status { width: 100%; text-align: center; font-size: 13px; color: var(--muted); min-height: 1.2em; }
  #footer {
    position: fixed; right: 12px; bottom: 8px; font-size: 12px; color: var(--muted); opacity: .8;
  }
  #footer a { color: var(--muted); }
  @media (max-width: 600px) { #footer { display: none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="Fruit Ninja Cam game"></canvas>
<video id="cam" playsinline muted></video>
<div id="controls">
  <button id="play-cam" class="primary">Play with webcam</button>
  <button id="play-pointer">Play with mouse / touch</button>
  <div id="status">Camera frames are processed on your device and never uploaded.</div>
</div>
<div id="footer"><a href="https://github.com/joexu22/fruit-ninja-cam">source on GitHub</a> · MediaPipe Hand Landmarker</div>
<script type="module" src="game.js"></script>
</body>
</html>
